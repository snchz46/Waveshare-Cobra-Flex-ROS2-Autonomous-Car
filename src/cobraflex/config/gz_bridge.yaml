# gz topics published by the Sensors plugin (ZED Mini front stereo pair).
# The left camera is an rgbd_camera (see urdf/robot.gazebo) and advertises
# four topics under the camera/left prefix; three of them are bridged here.
#
# The fourth topic, camera/left/points, is intentionally not bridged.
# gz-sensors assigns a single frame_id (the <optical_frame_id>) to the four
# outputs, but they do not share one axis convention:
#
#   image / depth_image / camera_info   Optical: z forward, x right, y down.
#                                       camera_info carries a pinhole K and
#                                       the depth is measured along the
#                                       optical axis; both require the
#                                       optical frame.
#
#   points                              Body: x forward, y left, z up. The
#                                       depth shader ends with
#                                         point = vec3(-vsPos.z, -vsPos.x,
#                                                       vsPos.y)
#                                       under the comment "convert to z up"
#                                       (gz-rendering8, depth_camera_fs.glsl),
#                                       and no later step converts it back:
#                                       gz-sensors8 PointCloudUtil::FillMsg
#                                       copies x, y, z unchanged, and
#                                       RgbdCameraSensor.cc:397 stamps the
#                                       cloud with OpticalFrameId().
#
# A single frame_id cannot describe both conventions. A bridged cloud, with
# the URDF rotation -90/0/-90 applied a second time through the optical frame,
# appears rotated by 90 degrees in RViz. gazebo.launch.py therefore
# reprojects the depth image with the intrinsics of camera_info; the result
# is in the optical frame expected by all ROS consumers and corresponds to the
# projection of the ZED SDK on the physical robot.
#
# Verified against the Gazebo sources: the behaviour is identical in Fortress
# (gz-sensors6, RgbdCameraSensor.cc:469) and Harmonic, and the shader
# mathematics is unchanged between ign-rendering6 and gz-rendering8; the only
# differences concern the Vulkan/Ogre GLSL syntax migration.
- ros_topic_name: "camera/left/camera_info"
  gz_topic_name: "camera/left/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# An rgbd_camera derives its topic names from the <topic> prefix and always
# names this topic /image; the name is not configurable.
- ros_topic_name: "camera/left/image"
  gz_topic_name: "camera/left/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Depth as 32FC1 in metres. ros_gz converts the gz pixel format R_FLOAT32 to
# 32FC1 in both directions (ros_gz_bridge convert/sensor_msgs.cpp); no
# additional conversion node is required.
- ros_topic_name: "camera/left/depth_image"
  gz_topic_name: "camera/left/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

