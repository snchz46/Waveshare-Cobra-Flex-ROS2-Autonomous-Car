# Guide check: installs the workspace on clean Ubuntu containers and runs the
# simulation procedures of the documentation.
#
#   install: guide      Lab PC part of docs/1_INSTALLATION.md (Ubuntu 24.04,
#                       ROS 2 Jazzy), executed as written (extracted from the
#                       Markdown by .github/scripts/run_guide.py).
#   install: reference  Official Jazzy + Gazebo Harmonic installation on
#                       Ubuntu 24.04 (.github/scripts/install_reference.sh).
#   install: humble     Humble + Gazebo Harmonic on Ubuntu 22.04
#                       (.github/scripts/install_humble.sh). The robot runs
#                       Humble without Gazebo; this variant covers its code
#                       paths in simulation, chiefly nav2_params.yaml.
#
# All variants then run .github/scripts/sim_smoke_test.sh: xacro and SDF
# validation, gazebo.launch.py topics and TF, SLAM and map saving, Nav2, driving
# by /cmd_vel, LiDAR avoidance, lane keeping, teleoperation GUI, lab session code
# and colcon test. The robot part of docs/1_INSTALLATION.md (JetPack, ZED SDK)
# and the physical-robot procedures (docs/3_ROBOT_OPERATION.md) require the
# hardware and are not covered.
#
# Manual trigger only: Actions tab > Guide check > Run workflow.
name: Guide check

on:
  workflow_dispatch:

concurrency:
  group: guide-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guide-check:
    name: install=${{ matrix.install }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - install: guide
            image: ubuntu:24.04
          - install: reference
            image: ubuntu:24.04
          - install: humble
            image: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
      LOG_DIR: /tmp/smoke_logs
      GUIDE_VARIANT: install=${{ matrix.install }}
    steps:
      - name: Container prerequisites (not part of the guide)
        run: |
          apt-get update
          apt-get install -y sudo git python3 ca-certificates tzdata
          # Non-interactive apt for the unmodified guide commands. sudo resets
          # DEBIAN_FRONTEND, so debconf is also set to Noninteractive globally;
          # otherwise tzdata and keyboard-configuration wait for input.
          printf 'APT::Get::Assume-Yes "true";\nDpkg::Options { "--force-confdef"; "--force-confold"; };\n' \
            > /etc/apt/apt.conf.d/90-ci
          echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
          echo 'Defaults env_keep += "DEBIAN_FRONTEND"' > /etc/sudoers.d/90-ci

      - uses: actions/checkout@v4

      - name: Workspace at ~/ros2_ws (replaces the git clone of the guide)
        run: ln -sfn "$GITHUB_WORKSPACE" "$HOME/ros2_ws"

      - name: Installation as written in docs/1_INSTALLATION.md (lab PC)
        if: matrix.install == 'guide'
        timeout-minutes: 60
        run: python3 .github/scripts/run_guide.py docs/1_INSTALLATION.md "Lab PC" < /dev/null

      - name: Reference installation (Jazzy + Gazebo Harmonic)
        if: matrix.install == 'reference'
        timeout-minutes: 60
        run: bash .github/scripts/install_reference.sh < /dev/null

      - name: Humble installation (Humble + Gazebo Harmonic)
        if: matrix.install == 'humble'
        timeout-minutes: 60
        run: bash .github/scripts/install_humble.sh < /dev/null

      - name: Headless display (not part of the guide)
        if: always()
        timeout-minutes: 10
        run: apt-get install -y xvfb mesa-utils libgl1-mesa-dri

      - name: Simulation smoke test (docs/2_USAGE.md, lab/README.md)
        if: always()
        timeout-minutes: 60
        run: bash .github/scripts/sim_smoke_test.sh < /dev/null

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.install }}
          path: /tmp/smoke_logs
          if-no-files-found: ignore
